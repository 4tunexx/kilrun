[package]
name = "kilrun-desktop"
version = "0.1.0"
description = "Kilrun Windows desktop application"
authors = ["Kilrun"]
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

[lib]
name = "kilrun_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
tauri = { version = "2.11.3", features = ["devtools"] }
