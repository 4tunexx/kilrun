name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Prisma only needs a syntactically valid URL to generate the client; CI never connects to a DB.
  DATABASE_URL: mongodb://localhost:27017/ci

jobs:
  web:
    name: Web (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  game-server:
    name: Game server (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install root (provides ESLint + TypeScript plugins used by server lint)
        run: npm ci --ignore-scripts
      - name: Install server
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Lint
        run: npm run lint:server
      - name: Build
        working-directory: server
        run: npm run build

  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking until Phase 3 clears the known advisories, then remove continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Root
        run: npm audit --omit=dev --audit-level=high
      - name: Game server
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
