[package]
name = "kilrun-engine"
version = "0.1.3"
description = "Kilrun Engine — Windows map editor and game-development application"
authors = ["Kilrun"]
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

[lib]
name = "kilrun_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
base64 = "0.22"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# Windows DPAPI (CryptProtectData/CryptUnprotectData) so the saved live-site
# session token is encrypted at rest, bound to the current Windows user
# account, instead of sitting in engine-config.json as plaintext.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
