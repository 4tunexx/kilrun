[package]
name = "kilrun-engine"
version = "0.1.0"
description = "Kilrun Engine — Windows map editor and game-development application"
authors = ["Kilrun"]
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

[lib]
name = "kilrun_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
